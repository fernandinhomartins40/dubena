name: Deploy erp-novo (HOMOLOGAÇÃO)

# Deploy do backend reescrito (erp-novo) em ambiente de HOMOLOGAÇÃO na VPS.
# Roda no mesmo self-hosted runner do ctrl-web, mas em ambiente ISOLADO:
# rede/containers/volumes próprios, banco Postgres próprio, porta 3120.
# NÃO toca a produção do legado (princípio #1 do plano de reescrita).
on:
  push:
    branches: [main]
    paths:
      - 'erp-novo/**'
      - '.github/workflows/deploy-erp-novo-homolog.yml'
  workflow_dispatch:        # permite disparar manualmente (homolog sob demanda)

concurrency:
  group: deploy-erp-novo-homolog
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted     # roda DENTRO da VPS (sem SSH)
    timeout-minutes: 30
    defaults:
      run:
        working-directory: erp-novo

    steps:
      - name: Corrigir permissões do workspace (antes do checkout)
        # Containers rodam como root e podem deixar storage/cache com dono root,
        # impedindo o checkout de limpar (EACCES). Um container root reverte o dono.
        working-directory: .
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/ws alpine:3 \
            sh -c "chown -R $(id -u):$(id -g) /ws 2>/dev/null || true" || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Restaurar .env de homologação (persistido fora do checkout)
        run: |
          # O checkout limpa não-rastreados; o .env (segredos) fica em
          # /opt/dubena-env/ e é copiado a cada deploy. Crie-o uma vez na VPS
          # a partir de erp-novo/.env.homolog.example.
          if [ ! -f /opt/dubena-env/erp-novo-homolog.env ]; then
            echo "ERRO: /opt/dubena-env/erp-novo-homolog.env não existe na VPS." >&2
            exit 1
          fi
          cp /opt/dubena-env/erp-novo-homolog.env .env

      - name: Build e subida dos containers
        run: |
          docker compose -f docker-compose.homolog.yml build
          docker compose -f docker-compose.homolog.yml up -d --force-recreate
          # Aguarda o container app ficar estável (entrypoint sobe o php-fpm sozinho).
          for i in $(seq 1 15); do
            st=$(docker inspect -f '{{.State.Status}}' erpnovo-app 2>/dev/null || echo none)
            [ "$st" = "running" ] && break
            echo "aguardando erpnovo-app ($st)..."; sleep 3
          done

      - name: Aguardar o Postgres aceitar conexão
        run: |
          # O --force-recreate reinicia o db; o migrate falha se rodar antes de aceitar.
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.homolog.yml exec -T db pg_isready -U "${DB_USERNAME:-erp}" >/dev/null 2>&1; then
              echo "Postgres pronto."; break
            fi
            echo "aguardando Postgres ($i)..."; sleep 2
          done

      - name: Instalar dependências (composer, do lock)
        run: |
          # IDEMPOTENTE: o volume app_vendor persiste entre deploys; instala/atualiza
          # sempre (garante vendor presente mesmo se um deploy anterior falhou).
          docker compose -f docker-compose.homolog.yml exec -T -e COMPOSER_PROCESS_TIMEOUT=0 app \
            composer install --no-interaction --prefer-dist --no-progress --no-dev \
            --no-scripts --optimize-autoloader
          # Garante o autoload (falha explícita se o vendor não populou — evita 500 silencioso).
          docker compose -f docker-compose.homolog.yml exec -T app test -f vendor/autoload.php

      - name: Garantir estrutura de storage (volume sobe vazio)
        run: |
          docker compose -f docker-compose.homolog.yml exec -T app sh -c '
            mkdir -p storage/framework/cache storage/framework/sessions \
                     storage/framework/views storage/logs storage/app/public \
                     bootstrap/cache &&
            chown -R www-data:www-data storage bootstrap/cache'

      - name: App key, migrations, cache
        run: |
          docker compose -f docker-compose.homolog.yml exec -T app sh -c \
            'grep -q "^APP_KEY=base64:" .env || php artisan key:generate --force'
          docker compose -f docker-compose.homolog.yml exec -T app php artisan migrate --force
          # Limpa caches antes; config:cache por último (SPA é estática, não depende disto).
          docker compose -f docker-compose.homolog.yml exec -T app php artisan optimize:clear
          docker compose -f docker-compose.homolog.yml exec -T app php artisan config:cache

      - name: Seed base — DeploySeeder (idempotente, todo deploy)
        run: |
          # Sempre roda: admin/empresa + RBAC (catálogo de permissões atualizado;
          # chaves novas entram automaticamente). Para adicionar futuros seeders
          # idempotentes ao deploy, edite database/seeders/DeploySeeder.php — NÃO
          # é preciso mexer neste workflow.
          docker compose -f docker-compose.homolog.yml exec -T app \
            php artisan db:seed --class='Database\Seeders\DeploySeeder' --force

      - name: Seed massa demo (Guarapuava) — quando o banco ainda não está populado
        run: |
          # A massa demo (200 clientes/500 pedidos) NÃO é idempotente por volume.
          # Roda quando há POUCOS clientes (<=50): cobre o 1º deploy e também o caso
          # de só haver resíduo de seeds antigos (ex.: 6 do GuarapuavaMapaSeeder).
          # Acima disso considera-se populado e pula. Mesmo limiar do guard interno
          # do seeder (proteção dupla — nunca duplica os 200).
          clientes=$(docker compose -f docker-compose.homolog.yml exec -T app \
            php artisan tinker --execute='echo \App\Models\Cliente\Cliente::withoutTenant()->count();' 2>/dev/null | tr -dc '0-9')
          clientes=${clientes:-0}
          echo "Clientes existentes: $clientes"
          if [ "$clientes" -gt 50 ]; then
            echo "Banco já populado ($clientes clientes) — pulando massa demo."
          else
            echo "Banco com poucos dados ($clientes) — populando massa demo de Guarapuava."
            docker compose -f docker-compose.homolog.yml exec -T app \
              php artisan db:seed --class='Database\Seeders\DemoGuarapuavaSeeder' --force
          fi

      - name: Normalizar dono do storage (www-data) — após os artisan
        run: |
          # Os artisan acima rodam como ROOT (docker exec); o php-fpm é www-data.
          docker compose -f docker-compose.homolog.yml exec -T app \
            sh -c 'chown -R www-data:www-data storage bootstrap/cache'

      - name: Health check (landing / + API /novo/up + SPA /novo/app, porta 3120)
        run: |
          # API sob /novo (o nginx do container faz strip → /up) com retry.
          api=000
          for i in $(seq 1 10); do
            api=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3120/novo/up || echo 000)
            [ "$api" = "200" ] && break
            echo "aguardando /novo/up ($api)..."; sleep 3
          done
          # Landing na raiz exata (monorepo: servida pelo container).
          land=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3120/ || echo 000)
          # SPA estática sob /novo/app (deve responder 200 com o index.html).
          spa=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3120/novo/app/ || echo 000)
          echo "HTTP /: $land | /novo/up: $api | /novo/app/: $spa"
          if [ "$api" != "200" ] || [ "$spa" != "200" ] || [ "$land" != "200" ]; then
            echo "Health check falhou (/=$land /novo/up=$api /novo/app=$spa)" >&2
            docker compose -f docker-compose.homolog.yml logs --tail=50 app web >&2 || true
            exit 1
          fi
