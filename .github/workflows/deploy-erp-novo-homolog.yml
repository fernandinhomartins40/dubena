name: Deploy erp-novo (HOMOLOGAÇÃO)

on:
  workflow_run:
    workflows: ['CI erp-novo (backend reescrito)']
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-erp-novo-homolog
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: erp-novo
    env:
      ENV_HOMOLOG: /opt/dubena-env/erp-novo-homolog.env
      RELEASES_DIR: /opt/dubena-releases
      RELEASE_ID: ${{ github.event.workflow_run.head_sha }}
      REGISTRY_PREFIX: ghcr.io/${{ github.repository_owner }}

    steps:
      - name: Checkout exato da release aprovada
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          clean: false

      - name: Validar ambiente e autenticar no GHCR
        run: |
          test -r "$ENV_HOMOLOG" || { echo "env de homologação ausente" >&2; exit 78; }
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Resolver e registrar o manifesto imutável
        run: |
          set -eu
          app_tag="${REGISTRY_PREFIX}/erpnovo-app:${RELEASE_ID}"
          web_tag="${REGISTRY_PREFIX}/erpnovo-web:${RELEASE_ID}"
          app_digest=$(docker buildx imagetools inspect "$app_tag" | awk '/^Digest:/ {print $2; exit}')
          web_digest=$(docker buildx imagetools inspect "$web_tag" | awk '/^Digest:/ {print $2; exit}')
          case "$app_digest:$web_digest" in sha256:*:sha256:*) ;; *) exit 1;; esac
          APP_IMAGE="${app_tag}@${app_digest}"
          WEB_IMAGE="${web_tag}@${web_digest}"
          mkdir -p "$RELEASES_DIR"
          umask 022
          manifest_tmp="${RELEASES_DIR}/${RELEASE_ID}.env.tmp"
          printf 'RELEASE_ID=%s\nAPP_IMAGE=%s\nWEB_IMAGE=%s\n' \
            "$RELEASE_ID" "$APP_IMAGE" "$WEB_IMAGE" > "$manifest_tmp"
          mv "$manifest_tmp" "${RELEASES_DIR}/${RELEASE_ID}.env"
          echo "APP_IMAGE=$APP_IMAGE" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=$WEB_IMAGE" >> "$GITHUB_ENV"

      - name: Pull, migration pelo owner e promoção sem rebuild
        run: |
          sh docker/compose-homolog.sh pull
          sh docker/compose-homolog.sh run --rm app \
            php artisan migrate --force --database=pgsql_owner
          sh docker/compose-homolog.sh up -d --no-build --remove-orphans

      - name: Provar digest executado e health
        run: |
          set -eu
          esperado_app=$(docker image inspect "$APP_IMAGE" --format '{{.Id}}')
          esperado_web=$(docker image inspect "$WEB_IMAGE" --format '{{.Id}}')
          test "$(docker inspect erpnovo-app --format '{{.Image}}')" = "$esperado_app"
          test "$(docker inspect erpnovo-web --format '{{.Image}}')" = "$esperado_web"
          for attempt in $(seq 1 15); do
            api=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3120/novo/up || echo 000)
            spa=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3120/novo/app/ || echo 000)
            [ "$api:$spa" = '200:200' ] && exit 0
            echo "health tentativa ${attempt}: api=${api}, spa=${spa}"
            sleep 4
          done
          sh docker/compose-homolog.sh logs --tail=80 app web >&2
          exit 1
