name: Deploy erp-novo (PRODUÇÃO)

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: 'Digite PRODUCAO para confirmar'
        required: true
      release_id:
        description: 'SHA completo já aprovado em homologação'
        required: true
      rollback_release:
        description: 'Release anterior, obrigatória para rollback automático'
        required: true

concurrency:
  group: deploy-erp-novo-producao
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: erp-novo
    env:
      ENV_PRODUCAO: /opt/dubena-env/erp-novo-producao.env
      RELEASES_DIR: /opt/dubena-releases
      RELEASE_ID: ${{ inputs.release_id }}
      ROLLBACK_RELEASE: ${{ inputs.rollback_release }}
      DEPLOY_ACTOR: ${{ github.actor }}

    steps:
      - name: Validar autorização e releases
        working-directory: .
        run: |
          set -eu
          [ '${{ inputs.confirmacao }}' = PRODUCAO ] || exit 78
          for release in "$RELEASE_ID" "$ROLLBACK_RELEASE"; do
            case "$release" in *[!0-9a-f]*|'') exit 78;; esac
            [ "${#release}" -eq 40 ] || exit 78
          done
          [ "$RELEASE_ID" != "$ROLLBACK_RELEASE" ] || exit 78
          test -r "${RELEASES_DIR}/${RELEASE_ID}.env"
          test -r "${RELEASES_DIR}/${ROLLBACK_RELEASE}.env"

      - name: Checkout exato da release homologada
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_id }}
          clean: false

      - name: Carregar manifesto e validar ambiente
        run: |
          set -eu
          test -r "$ENV_PRODUCAO" || exit 78
          grep -qx 'APP_ENV=production' "$ENV_PRODUCAO"
          grep -qx 'APP_DEBUG=false' "$ENV_PRODUCAO"
          manifest="${RELEASES_DIR}/${RELEASE_ID}.env"
          grep -qx "RELEASE_ID=${RELEASE_ID}" "$manifest"
          APP_IMAGE=$(sed -n 's/^APP_IMAGE=//p' "$manifest")
          WEB_IMAGE=$(sed -n 's/^WEB_IMAGE=//p' "$manifest")
          echo "APP_IMAGE=$APP_IMAGE" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=$WEB_IMAGE" >> "$GITHUB_ENV"

      - name: Backup obrigatório antes de qualquer escrita
        working-directory: .
        run: bash deploy/backup/backup.sh

      - name: Pull e migration pela imagem homologada
        run: |
          sh docker/compose-production.sh pull
          sh docker/compose-production.sh run --rm app \
            php artisan migrate --force --database=pgsql_owner

      - name: Promover os mesmos bytes sem rebuild
        id: promote
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          sh docker/compose-production.sh up -d --no-build --remove-orphans

      - name: Caches, gate estrito, digest e health
        run: |
          set -eu
          sh docker/compose-production.sh exec -T app php artisan optimize
          sh docker/compose-production.sh exec -T app php artisan golive:check --strict
          esperado_app=$(docker image inspect "$APP_IMAGE" --format '{{.Id}}')
          esperado_web=$(docker image inspect "$WEB_IMAGE" --format '{{.Id}}')
          test "$(docker inspect erpnovo-prod-app --format '{{.Image}}')" = "$esperado_app"
          test "$(docker inspect erpnovo-prod-web --format '{{.Image}}')" = "$esperado_web"
          for attempt in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3130/up || echo 000)
            [ "$code" = 200 ] && break
            echo "health tentativa ${attempt}: ${code}"
            sleep 5
          done
          [ "$code" = 200 ]
          ln -sfn "${RELEASES_DIR}/${RELEASE_ID}.env" "${RELEASES_DIR}/production-current.env"

      - name: Rollback automático para digest anterior
        if: failure() && steps.promote.outputs.started == 'true'
        working-directory: .
        run: |
          RELEASES_DIR="$RELEASES_DIR" ENV_PRODUCAO="$ENV_PRODUCAO" \
            bash deploy/rollback.sh "$ROLLBACK_RELEASE"

      - name: Resumo auditável
        if: always()
        working-directory: .
        env:
          DEPLOY_RESULT: ${{ job.status }}
        run: |
          # shellcheck disable=SC2016
          printf '## Deploy produção\n- Release: `%s`\n- Rollback: `%s`\n- Ator: %s\n- Resultado: %s\n' \
            "$RELEASE_ID" "$ROLLBACK_RELEASE" "$DEPLOY_ACTOR" "$DEPLOY_RESULT" \
            >> "$GITHUB_STEP_SUMMARY"
