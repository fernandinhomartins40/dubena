name: Deploy erp-novo (PRODUÇÃO)

# Mesmo mecanismo da homologação (runner do GitHub + SSH; a VPS não constrói
# nada) e os mesmos secrets VPS_HOST / VPS_SSH_KEY / VPS_KNOWN_HOSTS. Promove
# EXATAMENTE os bytes já homologados: a release precisa ter manifesto na VPS,
# que só existe se ela passou pelo deploy de homologação.
on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: 'Digite PRODUCAO para confirmar'
        required: true
      release_id:
        description: 'SHA completo já aprovado em homologação'
        required: true
      rollback_release:
        description: 'Release anterior, obrigatória para rollback automático'
        required: true

concurrency:
  group: deploy-erp-novo-producao-ssh
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    env:
      RELEASE_ID: ${{ inputs.release_id }}
      ROLLBACK_RELEASE: ${{ inputs.rollback_release }}
      RELEASES_DIR: /opt/dubena-releases
      BUNDLE_BASE: /opt/dubena/erp-novo/releases

    steps:
      - name: Validar autorização, releases e secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -eu
          [ '${{ inputs.confirmacao }}' = PRODUCAO ] || exit 78
          for release in "$RELEASE_ID" "$ROLLBACK_RELEASE"; do
            case "$release" in *[!0-9a-f]*|'') exit 78;; esac
            [ "${#release}" -eq 40 ] || exit 78
          done
          [ "$RELEASE_ID" != "$ROLLBACK_RELEASE" ] || exit 78
          for s in VPS_HOST VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            eval "v=\${$s}"
            [ -n "$v" ] || { echo "::error::secret $s ausente"; exit 78; }
          done

      - name: Checkout dos arquivos de implantação da release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_id }}

      - name: Configurar SSH (host verificado)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User root\n  IdentityFile ~/.ssh/deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  ConnectTimeout 20\n  ServerAliveInterval 15\n' \
            "$VPS_HOST" > ~/.ssh/config

      # A imagem promovida é a do MANIFESTO de homologação, não uma resolução
      # nova da tag: a tag poderia ter sido reescrita no registry depois.
      - name: Carregar manifestos homologados
        run: |
          set -eu
          manifesto=$(ssh vps "cat '${RELEASES_DIR}/${RELEASE_ID}.env'")
          ssh vps "test -r '${RELEASES_DIR}/${ROLLBACK_RELEASE}.env'"
          printf '%s\n' "$manifesto" | grep -qx "RELEASE_ID=${RELEASE_ID}"
          printf '%s\n' "$manifesto" | sed -n 's/^\(APP_IMAGE\|WEB_IMAGE\)=/\1=/p' >> "$GITHUB_ENV"

      - name: Enviar bundle de implantação
        run: |
          set -eu
          tar -czf - \
            erp-novo/docker-compose.homolog.yml erp-novo/docker-compose.producao.yml \
            erp-novo/docker/compose-homolog.sh erp-novo/docker/compose-production.sh \
            deploy/remote-deploy.sh deploy/rollback.sh deploy/backup \
          | ssh vps "set -e; d='${BUNDLE_BASE}/${RELEASE_ID}'; mkdir -p \"\$d\"; tar -xzf - -C \"\$d\""

      - name: Backup, pull, migration, promoção e gate estrito
        id: promote
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          echo '${{ secrets.GITHUB_TOKEN }}' | ssh vps \
            "GHCR_USER='${{ github.actor }}' bash '${BUNDLE_BASE}/${RELEASE_ID}/deploy/remote-deploy.sh' producao '${RELEASE_ID}' '${APP_IMAGE}' '${WEB_IMAGE}'"

      - name: Rollback automático para digest anterior
        if: failure() && steps.promote.outputs.started == 'true'
        run: |
          ssh vps "RELEASES_DIR='${RELEASES_DIR}' bash '${BUNDLE_BASE}/${RELEASE_ID}/deploy/rollback.sh' '${ROLLBACK_RELEASE}'"

      - name: Resumo auditável
        if: always()
        env:
          DEPLOY_RESULT: ${{ job.status }}
          DEPLOY_ACTOR: ${{ github.actor }}
        run: |
          # shellcheck disable=SC2016
          printf '## Deploy produção\n- Release: `%s`\n- Rollback: `%s`\n- Ator: %s\n- Resultado: %s\n' \
            "$RELEASE_ID" "$ROLLBACK_RELEASE" "$DEPLOY_ACTOR" "$DEPLOY_RESULT" \
            >> "$GITHUB_STEP_SUMMARY"
          rm -f ~/.ssh/deploy
