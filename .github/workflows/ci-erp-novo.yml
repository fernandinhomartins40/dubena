name: CI erp-novo (backend reescrito)

# Suíte do backend NOVO (greenfield, plano de reescrita N0+).
# Roda em sqlite :memory: (definido no phpunit.xml) — não precisa de serviço de DB.
on:
  pull_request:
    branches: [main]
    paths:
      - 'erp-novo/**'
      - '.github/workflows/ci-erp-novo.yml'
  push:
    branches:
      - 'n*-**'   # branches de fase (n0-fundacao, n1-..., etc.)
      - 'ci-**'
    paths:
      - 'erp-novo/**'
      - '.github/workflows/ci-erp-novo.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: erp-novo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, sqlite, pdo_sqlite, mbstring, bcmath, intl
          coverage: none

      - name: Cache de dependências Composer
        uses: actions/cache@v4
        with:
          path: erp-novo/vendor
          key: composer-${{ hashFiles('erp-novo/composer.lock') }}
          restore-keys: composer-

      - name: Instala dependências
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepara ambiente de teste
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint PHP (sintaxe)
        run: |
          err=0
          for f in $(find app database routes tests -name "*.php"); do
            php -l "$f" >/dev/null 2>&1 || { php -l "$f"; err=1; }
          done
          [ "$err" -eq 0 ] || { echo "Lint PHP falhou"; exit 1; }
          echo "Lint OK"

      - name: Suíte de testes (PHPUnit)
        run: php artisan test
