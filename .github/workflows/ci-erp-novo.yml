name: CI erp-novo (backend reescrito)

# Dois jobs:
#  - test:          sqlite :memory: (rápido, feedback imediato — phpunit.xml).
#  - test-postgres: PostgreSQL com role NÃO-superuser (Q-6 da auditoria) — é o
#    único jeito de exercer RLS de verdade (no sqlite ela é no-op) e a busca
#    `ilike`. O RlsCoberturaTest só valida cobertura de policy aqui.
on:
  pull_request:
    branches: [main]
    paths:
      - 'erp-novo/**'
      - 'deploy/nginx/**'
      - 'deploy/rollback.sh'
      - 'docs/01-vigente/implementacao-saas/CATALOGO_VIVO.json'
      - '.github/workflows/ci-erp-novo.yml'
  push:
    branches:
      - main      # fluxo atual: commit por fase direto na main (Q-6: main também testa)
      - 'n*-**'   # branches de fase (n0-fundacao, n1-..., etc.)
      - 'ci-**'
    paths:
      - 'erp-novo/**'
      - 'deploy/nginx/**'
      - 'deploy/rollback.sh'
      - 'docs/01-vigente/implementacao-saas/CATALOGO_VIVO.json'
      - '.github/workflows/ci-erp-novo.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: erp-novo

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.3'
          extensions: pdo, sqlite, pdo_sqlite, mbstring, bcmath, intl
          # A suite roda num processo so e a memoria ACUMULA. O dompdf (fonte
          # DejaVu embarcada, exigida para acentuacao) estoura os 128M do
          # default do PHP na metade da suite, em Linux — no Windows o mesmo
          # codigo passa, e foi por isso que a quebra so apareceu aqui.
          ini-values: memory_limit=512M
          coverage: none

      - name: Cache de dependências Composer
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: erp-novo/vendor
          key: composer-${{ hashFiles('erp-novo/composer.lock') }}
          restore-keys: composer-

      - name: Instala dependências
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Auditoria do lock de produção
        run: composer audit --locked --no-dev

      - name: Prepara ambiente de teste
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint PHP (sintaxe)
        run: |
          err=0
          while IFS= read -r -d '' f; do
            php -l "$f" >/dev/null 2>&1 || { php -l "$f"; err=1; }
          done < <(find app database routes tests -name '*.php' -print0)
          [ "$err" -eq 0 ] || { echo "Lint PHP falhou"; exit 1; }
          echo "Lint OK"

      - name: Gate Nginx TLS, proxy e headers
        run: bash ../deploy/nginx/test-config.sh

      - name: Suíte de testes (PHPUnit)
        run: php artisan test

  # FE-3 (auditoria): a SPA passa a ter testes (Vitest) + type-check no CI —
  # antes o "lint" era só tsc. Cobre os formatadores, o RBAC do cliente (can/
  # canField/normalizarMe) e componentes (Can, ErrorBoundary).
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: erp-novo/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: erp-novo/frontend/package-lock.json

      - name: Instala dependências
        run: npm ci

      - name: Auditoria do lock de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check (tsc)
        run: npm run lint

      - name: Testes (Vitest)
        run: npm test

  # Q-6 (auditoria): a mesma suíte contra PostgreSQL, conectando com uma role
  # NOSUPERUSER/NOBYPASSRLS (como a erp_app de produção) — assim a RLS é exercida
  # de verdade (superuser a ignora) e o RlsCoberturaTest vira o guardião contra
  # tabela nova sem policy. O seed também roda aqui (gotcha sqlite×PG de varchar).
  test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: erp-novo

    services:
      postgres:
        image: postgres:15.14-alpine@sha256:64583b3cb4f2010277bdd9749456de78e5c36f8956466ba14b0b96922e510950
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: erp_teste
      DB_USERNAME: erp_app
      DB_PASSWORD: runtime_test_password_2026
      DB_OWNER_USERNAME: postgres
      DB_OWNER_PASSWORD: postgres
      RLS_APP_DB_PASSWORD: runtime_test_password_2026

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, pgsql, mbstring, bcmath, intl
          # Mesmo motivo do job `test`: memoria acumulada pela suite inteira.
          ini-values: memory_limit=512M
          coverage: none

      - name: Cache de dependências Composer
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: erp-novo/vendor
          key: composer-${{ hashFiles('erp-novo/composer.lock') }}
          restore-keys: composer-

      - name: Instala dependências
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Cria banco de teste (owner separado do runtime)
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c \
            "CREATE DATABASE erp_teste OWNER postgres;"

      - name: Prepara ambiente de teste
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Gate PostgreSQL/RLS (owner migra; runtime testa; zero skip)
        run: composer test:pgsql-rls

  # BUILD — um job por imagem, no runner do GitHub, NUNCA na VPS.
  #
  # Antes era um job só, construindo as duas imagens em série e sem cache: cada
  # push recompilava as extensões PHP (gd, intl, soap…) do zero. Agora:
  #  - app e web constroem em PARALELO, cada uma no seu job;
  #  - o cache de camadas fica no próprio GHCR (`:buildcache`), então só o que
  #    mudou recompila — mexer em PHP não reconstrói a base, mexer na SPA não
  #    reinstala o Composer;
  #  - os builds NÃO esperam os testes: rodam ao mesmo tempo. Imagem publicada
  #    sem teste verde não é promovida — o deploy só dispara quando o workflow
  #    INTEIRO (testes + builds) termina em sucesso.
  build-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - imagem: erpnovo-app
            target: runtime
          - imagem: erpnovo-web
            target: web
    defaults:
      run:
        working-directory: erp-novo
    env:
      IMAGEM: ghcr.io/${{ github.repository_owner }}/${{ matrix.imagem }}
    steps:
      - name: Checkout exato da release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Login no GHCR
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      # O driver padrão (`docker`) não exporta cache para registry nem publica
      # attestations (provenance/SBOM), exigidas pela release desde F0-05.
      - name: Builder BuildKit
        run: docker buildx create --name release --driver docker-container --use --bootstrap

      - name: Build, provenance, SBOM e push (${{ matrix.imagem }})
        run: |
          docker buildx build \
            --file docker/php/Dockerfile \
            --target '${{ matrix.target }}' \
            --tag "${IMAGEM}:${GITHUB_SHA}" \
            --cache-from "type=registry,ref=${IMAGEM}:buildcache" \
            --cache-to "type=registry,ref=${IMAGEM}:buildcache,mode=max" \
            --provenance=mode=max \
            --sbom=true \
            --push \
            .

      # Gate de vulnerabilidade por imagem (mesmo critério de antes: CRITICAL
      # com correção disponível reprova). Roda aqui para a VPS nunca receber
      # uma imagem reprovada.
      - name: Trivy (CRITICAL) e SBOM SPDX
        run: |
          set -eu
          digest=$(docker buildx imagetools inspect "${IMAGEM}:${GITHUB_SHA}" | awk '/^Digest:/ {print $2; exit}')
          ref="${IMAGEM}:${GITHUB_SHA}@${digest}"
          docker pull "$ref"
          mkdir -p "$RUNNER_TEMP/relatorios"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP/relatorios:/reports" \
            aquasec/trivy:0.66.0@sha256:086971aaf400beebd94e8300fd8ea623774419597169156cec56eec5b00dfb1e \
            image --scanners vuln --ignore-unfixed --severity CRITICAL \
            --exit-code 1 --format json --output /reports/trivy.json "$ref"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            anchore/syft:v1.33.0@sha256:f94e5d9fce1f2278491a8e3a63bd5f6ddb81fdfdbb8bf7a1637565c1d5344357 \
            "$ref" -o spdx-json > "$RUNNER_TEMP/relatorios/sbom.spdx.json"
          printf '%s `%s` — %s\n' '${{ matrix.imagem }}' "$digest" "$(docker image inspect "$ref" --format '{{.Size}}' | awk '{printf "%.0f MB", $1/1048576}')" >> "$GITHUB_STEP_SUMMARY"

      - name: Evidências da release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.imagem }}
          path: ${{ runner.temp }}/relatorios
          retention-days: 90
