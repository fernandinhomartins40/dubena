name: Deploy ctrl-web (ERP)

# Deploy automático via self-hosted runner instalado na própria VPS.
# A VPS conecta ao GitHub (saída), evitando o bloqueio de IPs Azure na porta 22.
on:
  push:
    branches: [main]
    paths:
      - 'ctrl-web/**'
      - '.github/workflows/deploy-ctrl-web.yml'
  workflow_dispatch:        # permite disparar manualmente

concurrency:
  group: deploy-ctrl-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted     # roda DENTRO da VPS (sem SSH)
    timeout-minutes: 30      # se travar, o GitHub mata o job e LIBERA o runner
                             # para o próximo deploy (evita prender a fila)
    defaults:
      run:
        working-directory: ctrl-web

    steps:
      - name: Corrigir permissões do workspace (antes do checkout)
        # Os containers rodam como root e podem deixar storage/cache com dono
        # root no checkout, impedindo o checkout de limpar (EACCES). Um container
        # root ajusta o dono de volta para o runner (sem precisar de sudo).
        working-directory: .
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/ws alpine:3 \
            sh -c "chown -R $(id -u):$(id -g) /ws 2>/dev/null || true" || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Restaurar .env de produção (persistido fora do checkout)
        run: |
          # O checkout limpa arquivos não-rastreados; o .env (segredos) fica em
          # /opt/dubena-env/ e é copiado a cada deploy. Crie-o uma vez na VPS.
          if [ ! -f /opt/dubena-env/ctrl-web.env ]; then
            echo "ERRO: /opt/dubena-env/ctrl-web.env não existe na VPS." >&2
            exit 1
          fi
          cp /opt/dubena-env/ctrl-web.env .env

      - name: Build e subida dos containers
        run: |
          docker compose -f docker-compose.prod.yml build
          # --force-recreate garante que o container app seja recriado pegando
          # mudanças de volumes (ex.: app_storage) e o entrypoint atual — o up -d
          # normal não recria se "nada mudou" e o storage ficaria sem framework/.
          docker compose -f docker-compose.prod.yml up -d --force-recreate
          # Aguarda o container app ficar estável (entrypoint sobe o php-fpm sem
          # depender de composer — então não fica em crash-loop).
          for i in $(seq 1 15); do
            st=$(docker inspect -f '{{.State.Status}}' ctrl-web-app 2>/dev/null || echo none)
            [ "$st" = "running" ] && break
            echo "aguardando ctrl-web-app ($st)..."; sleep 3
          done

      - name: Instalar dependências (composer, do lock)
        run: |
          # --no-scripts evita rodar artisan antes do .env/migrate; usa o lock.
          # --no-plugins: composer 2 bloqueia plugins fora da allow-list
          # (kylekatarnls/update-helper) e abortaria o install no deploy.
          # COMPOSER_PROCESS_TIMEOUT=0: o install do Laravel 6 (pacotes grandes)
          # estoura o limite padrão de 300s no unzip — sem isso o deploy trava.
          docker compose -f docker-compose.prod.yml exec -T -e COMPOSER_PROCESS_TIMEOUT=0 app \
            composer install --no-interaction --prefer-dist --no-progress --no-dev \
            --no-scripts --no-plugins --optimize-autoloader --ignore-platform-req=ext-oci8

      - name: Garantir estrutura de storage (volume sobe vazio)
        run: |
          # O volume app_storage sobe vazio; o framework precisa de
          # storage/framework/{cache,sessions,views} senão dá "valid cache path".
          docker compose -f docker-compose.prod.yml exec -T app sh -c '
            mkdir -p storage/framework/cache storage/framework/sessions \
                     storage/framework/views storage/logs storage/app/public \
                     bootstrap/cache &&
            chown -R www-data:www-data storage bootstrap/cache'

      - name: Limpar cache de package discovery (stale entre upgrades)
        run: |
          # bootstrap/cache/{packages,services}.php são PERSISTIDOS no volume
          # app_storage e sobrevivem entre deploys. Quando um pacote é REMOVIDO
          # do composer (ex.: jenssegers/date no salto L12), o cache antigo ainda
          # lista o ServiceProvider removido → o PRIMEIRO `php artisan` quebra com
          # "Class ... not found" ANTES de qualquer config:clear. Como o composer
          # install roda com --no-scripts, o package:discover não regenera sozinho.
          # Apagar os caches e redescobrir ANTES do primeiro artisan resolve.
          docker compose -f docker-compose.prod.yml exec -T app sh -c '
            rm -f bootstrap/cache/packages.php bootstrap/cache/services.php \
                  bootstrap/cache/config.php'
          docker compose -f docker-compose.prod.yml exec -T app php artisan package:discover --ansi

      - name: App key, migrations, cache
        run: |
          docker compose -f docker-compose.prod.yml exec -T app sh -c \
            'grep -q "^APP_KEY=base64:" .env || php artisan key:generate --force'
          docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force
          # módulo Api (schema "api" no mesmo Postgres) — unificação Fase 5/6
          docker compose -f docker-compose.prod.yml exec -T app php artisan migrate:api-module || true
          # módulo Monitoramento (schema "monitora" no mesmo Postgres) — unificação
          docker compose -f docker-compose.prod.yml exec -T app php artisan migrate:monitora-module || true
          docker compose -f docker-compose.prod.yml exec -T app php artisan config:clear
          docker compose -f docker-compose.prod.yml exec -T app php artisan config:cache
          # Pré-compila as views (inclui as do Filament) AGORA, no deploy, evitando
          # que o php-fpm (www-data) tente compilá-las em runtime e esbarre em arquivos
          # de cache com dono root (causa de 500 "file_put_contents Permission denied"
          # no /admin). Limpa antes p/ não herdar cache antigo de dono divergente.
          docker compose -f docker-compose.prod.yml exec -T app php artisan view:clear
          docker compose -f docker-compose.prod.yml exec -T app php artisan view:cache

      - name: Seed — menus de referência (telas do ERP)
        run: |
          # O banco nasce vazio: sem registros em "menus" não há permissões
          # possíveis e o admin é barrado em TODA tela (só vê /home).
          # MenuTableSeeder recria a árvore de menus (idempotente: limpa e
          # repovoa). Roda ANTES do DeployAdminSeeder, que concede permissões
          # sobre esses menus. NewMenusSeeder adiciona telas mais novas e é
          # best-effort (pula submenus cujo pai não exista, sem falhar).
          # '\' inicial: L8 prefixa Database\Seeders\ p/ classe sem namespace; os
          # seeders do projeto não têm (classmap) → barra força o global.
          docker compose -f docker-compose.prod.yml exec -T app \
            php artisan db:seed --class='\MenuTableSeeder' --force
          docker compose -f docker-compose.prod.yml exec -T app \
            php artisan db:seed --class='\NewMenusSeeder' --force

      - name: Seed — usuário admin + permissões totais (idempotente)
        run: |
          # Garante o usuário admin de forma idempotente e concede acesso a
          # todos os menus (menuusers). A senha vem de ADMIN_SEED_PASSWORD
          # (no .env); default 'admin1234' — trocar depois.
          docker compose -f docker-compose.prod.yml exec -T app \
            php artisan db:seed --class='\DeployAdminSeeder' --force
          # Admin do módulo Monitoramento (schema 'monitora', guard próprio).
          docker compose -f docker-compose.prod.yml exec -T app \
            php artisan db:seed --class='\DeployMonitoraAdminSeeder' --force || true

      - name: Seed — RBAC (papéis/permissões spatie) — M1.2
        run: |
          # Idempotente. Roda APÓS menus+admin (deriva permissões dos menus e migra
          # cada usuário convertendo menuusers→permissões; support=1 → papel Admin).
          # NÃO altera menus/menuusers (transição segura).
          docker compose -f docker-compose.prod.yml exec -T app \
            php artisan db:seed --class='\RbacSeeder' --force

      - name: Normalizar dono do storage (www-data) — após todos os artisan
        run: |
          # Os comandos artisan acima rodam como ROOT (docker exec) e podem deixar
          # caches/logs com dono root, que o php-fpm (www-data) não consegue
          # sobrescrever em runtime → 500 "Permission denied" (ex.: cache de views
          # do Filament no /admin). Garante o dono correto ao FIM do deploy.
          docker compose -f docker-compose.prod.yml exec -T app \
            sh -c 'chown -R www-data:www-data storage bootstrap/cache'

      - name: Health check (porta interna 3110)
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3110/login || echo 000)
          echo "HTTP /login: $code"
          if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then
            echo "Health check falhou (HTTP $code)" >&2
            docker compose -f docker-compose.prod.yml logs --tail=40 app web >&2 || true
            exit 1
          fi
