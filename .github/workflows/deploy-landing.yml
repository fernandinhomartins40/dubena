name: Deploy landing (gasemcasa.com)

# Publica a landing estática (deploy/landing/index.html) na raiz da VPS.
# Roda no MESMO self-hosted runner dos outros deploys (sem SSH/secrets): o runner
# já está dentro da VPS e tem acesso ao filesystem do host.
# Só copia um arquivo estático para /var/www/html/landing e recarrega o nginx —
# NÃO toca o legado, o container do erp-novo nem o banco.
on:
  push:
    branches: [main]
    paths:
      - 'deploy/landing/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch: # permite publicar sob demanda (ex.: após ajuste manual)

concurrency:
  group: deploy-landing
  cancel-in-progress: true

jobs:
  publish:
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publicar index.html em /var/www/html/landing
        run: |
          set -e
          DEST=/var/www/html/landing
          SRC=deploy/landing/index.html

          # sudo se disponível e necessário (a pasta do host costuma ser de root).
          SUDO=""
          if command -v sudo >/dev/null 2>&1; then SUDO="sudo -n"; fi

          $SUDO mkdir -p "$DEST"
          $SUDO cp "$SRC" "$DEST/index.html"
          echo "Landing publicada em $DEST/index.html"

      - name: Validar e recarregar o nginx do host
        run: |
          set -e
          SUDO=""
          if command -v sudo >/dev/null 2>&1; then SUDO="sudo -n"; fi

          # Só recarrega se a config estiver válida (não derruba o nginx em erro).
          if $SUDO nginx -t 2>/dev/null; then
            $SUDO systemctl reload nginx && echo "nginx recarregado." || echo "reload falhou (segue: o arquivo já está publicado)."
          else
            echo "nginx -t indisponível/sem permissão — arquivo publicado; recarregue manualmente se necessário."
          fi

      - name: Conferir a raiz (gasemcasa.com)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/ -H 'Host: gasemcasa.com' || echo 000)
          echo "HTTP raiz (Host gasemcasa.com): $code"
