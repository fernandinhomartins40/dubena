name: Deploy monitoramento-veiculos

on:
  push:
    branches: [main]
    paths:
      - 'monitoramento-veiculos/**'
      - '.github/workflows/deploy-monitoramento.yml'
  workflow_dispatch:

concurrency:
  group: deploy-monitoramento
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30      # se travar, o GitHub mata o job e LIBERA o runner
                             # para o próximo deploy (evita prender a fila)
    defaults:
      run:
        working-directory: monitoramento-veiculos

    steps:
      - name: Corrigir permissões do workspace (antes do checkout)
        # Containers rodam como root e podem deixar storage/cache com dono root
        # no checkout, impedindo o checkout de limpar (EACCES). Container root
        # ajusta o dono de volta para o runner (sem sudo).
        working-directory: .
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/ws alpine:3 \
            sh -c "chown -R $(id -u):$(id -g) /ws 2>/dev/null || true" || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Restaurar .env de produção (persistido fora do checkout)
        run: |
          if [ ! -f /opt/dubena-env/monitoramento-veiculos.env ]; then
            echo "ERRO: /opt/dubena-env/monitoramento-veiculos.env não existe na VPS." >&2
            exit 1
          fi
          cp /opt/dubena-env/monitoramento-veiculos.env .env

      - name: Build e subida dos containers
        run: |
          docker compose -f docker-compose.prod.yml build
          docker compose -f docker-compose.prod.yml up -d
          for i in $(seq 1 15); do
            st=$(docker inspect -f '{{.State.Status}}' monitora-app 2>/dev/null || echo none)
            [ "$st" = "running" ] && break
            echo "aguardando monitora-app ($st)..."; sleep 3
          done

      - name: Instalar dependências (composer, do lock)
        run: |
          docker compose -f docker-compose.prod.yml exec -T app \
            composer install --no-interaction --prefer-dist --no-progress --no-dev \
            --no-scripts --optimize-autoloader --ignore-platform-req=ext-oci8

      - name: App key, migrations, cache
        run: |
          docker compose -f docker-compose.prod.yml exec -T app sh -c \
            'grep -q "^APP_KEY=base64:" .env || php artisan key:generate --force'
          docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force
          docker compose -f docker-compose.prod.yml exec -T app php artisan config:cache

      - name: Health check (porta interna 3112)
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3112/login || echo 000)
          echo "HTTP /login: $code"
          if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then
            echo "Health check falhou (HTTP $code)" >&2
            docker compose -f docker-compose.prod.yml logs --tail=40 app web >&2 || true
            exit 1
          fi
