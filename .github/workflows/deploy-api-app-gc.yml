name: Deploy api-app-gc

on:
  push:
    branches: [main]
    paths:
      - 'api-app-gc/**'
      - '.github/workflows/deploy-api-app-gc.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api-app-gc
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: api-app-gc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Garantir .env de produção
        run: |
          if [ ! -f .env ]; then
            echo "ERRO: api-app-gc/.env não existe na VPS. Crie-o uma vez com os segredos de produção." >&2
            exit 1
          fi

      - name: Build e subida dos containers
        run: |
          docker compose -f docker-compose.prod.yml build
          docker compose -f docker-compose.prod.yml up -d

      - name: Dependências, app key, migrations
        run: |
          docker compose -f docker-compose.prod.yml exec -T app \
            composer install --no-interaction --prefer-dist --no-progress --no-dev --optimize-autoloader
          docker compose -f docker-compose.prod.yml exec -T app sh -c \
            'grep -q "^APP_KEY=base64:" .env || php artisan key:generate --force'
          docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force
          docker compose -f docker-compose.prod.yml exec -T app php artisan config:cache

      - name: Health check (porta interna 3111)
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3111/api/video/get || echo 000)
          echo "HTTP /api/video/get: $code"
          if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then
            echo "Health check falhou (HTTP $code)" >&2
            docker compose -f docker-compose.prod.yml logs --tail=40 app web >&2 || true
            exit 1
          fi
