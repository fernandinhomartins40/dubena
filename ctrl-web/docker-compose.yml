# ──────────────────────────────────────────────────────────────────────────
# Ambiente de DEV/STAGING do ctrl-web (ERP).
# Laravel 5.4 · PHP 7.4 · PostgreSQL (saída do Oracle — Fase 3) · Redis.
# Portas distintas dos outros sistemas (8082/5433) para coexistirem.
# NÃO usar dados reais de produção. Ver README.docker.md antes de expor na VPS.
#
# ⚠️ 'php artisan migrate' ainda NÃO funciona em Postgres: ~19 migrations usam
#    SQL Oracle-específico. A tradução é o trabalho da Fase 3.
# ──────────────────────────────────────────────────────────────────────────
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: ctrl-erp-app:php7.4
    container_name: ctrl-erp-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    env_file:
      - .env.docker
    depends_on:
      - db
      - redis
    networks:
      - ctrl

  web:
    image: nginx:1.25-alpine
    container_name: ctrl-erp-web
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - ctrl

  db:
    image: postgres:15-alpine
    container_name: ctrl-erp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ctrl
      POSTGRES_USER: ctrl
      POSTGRES_PASSWORD: ctrl_dev_pwd        # senha FAKE de dev
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - ctrl

  redis:
    image: redis:7-alpine
    container_name: ctrl-erp-redis
    restart: unless-stopped
    networks:
      - ctrl

volumes:
  db_data:

networks:
  ctrl:
    driver: bridge
