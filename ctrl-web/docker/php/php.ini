; Ajustes de PHP para o ctrl-web / ERP (dev/staging)
; ERP gera relatórios/PDF/fiscais grandes — limites mais folgados.
memory_limit = 1024M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
date.timezone = America/Sao_Paulo

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

log_errors = On
error_log = /dev/stderr
display_errors = Off
