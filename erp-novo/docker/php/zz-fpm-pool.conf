; Pool do PHP-FPM do erp-novo. Sobrepõe o www.conf da imagem oficial, que vem
; com pm.max_children = 5.
;
; Com 5 processos, o painel inicial travava: ele dispara várias requisições ao
; mesmo tempo (/me, empresas, alertas, "para hoje", resumo), duas delas
; levavam 3 s cada, e o resto esperava na fila — medido em 12/10/2026 na
; homologação: o "para hoje" terminava ~15 s depois do /me, para 3 s de
; consulta. Cada aba aberta no painel ainda repete o "para hoje" a cada 60 s.
;
; 16: a VPS tem 4 núcleos e ~9 GB livres; um processo do Laravel ocupa ~50 MB,
; então 16 cabem com folga (~800 MB) sem disputar memória com as outras
; aplicações da VPS. A requisição típica passa a maior parte do tempo esperando
; o Postgres, por isso mais processos que núcleos.
;
; max_requests: recicla o processo depois de 500 requisições, contendo
; vazamento de memória de extensão sem custo perceptível.
[www]
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
