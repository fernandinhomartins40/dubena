; PHP do erp-novo (backend reescrito) — homologação/produção.
memory_limit = 1024M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
date.timezone = America/Sao_Paulo

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; O opcache no CLI existe por causa do SCHEDULER, nao do desenvolvedor.
; `schedule:work` cria um processo PHP NOVO por tarefa disparada, e sem isto
; cada um recompilava o Laravel inteiro do zero - framework, sped-nfe,
; phpspreadsheet, firebase, dompdf - so para rodar um `pix:expirar` de 20ms.
; Com 11 tarefas agendadas e polling de 30s, essa recompilacao era constante e
; foi a maior fatia do consumo de CPU que fez a Hostinger limitar a VPS.
opcache.enable_cli = 1

; `file_cache` e o que faz a economia existir de fato no CLI: a memoria do
; opcache morre junto com o processo, entao sem cache em DISCO o bytecode seria
; recompilado a cada tarefa mesmo com enable_cli=1. E aqui todo processo do
; scheduler e efemero por natureza.
opcache.file_cache = /tmp/opcache
opcache.file_cache_only = 0

; 128M porque o autoload daqui e grande (sped-nfe e phpspreadsheet sozinhos
; ocupam bastante); com os 64M do padrao a tabela satura e passa a despejar
; classes, que e o pior dos mundos - paga-se o custo do cache e recompila-se
; assim mesmo.
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000

log_errors = On
error_log = /dev/stderr
display_errors = Off
