# Nginx do CONTAINER do erp-novo (web → app:9000 php-fpm) — MONOREPO autossuficiente.
#
# Serve TUDO internamente sob o prefixo /novo (a SPA usa base /novo/app e chama
# /novo/api), MAIS a LANDING na raiz exata do domínio. O Nginx do HOST só faz
# TLS + proxy SEM strip de prefixo: gasemcasa.com/<qualquer-coisa> → este container.
#
#   /              → landing de venda do SaaS (CTA → /novo/app/; legado discreto no footer → /login)
#   /novo/app      → SPA React (build em public/app)
#   /novo/api,     → Laravel (php-fpm) — reescrito internamente para /index.php
#   /novo/sanctum
# Duração de cada requisição no log (rt = total, urt = PHP). Sem isso, a
# lentidão do painel em 12/10/2026 só pôde ser deduzida pela HORA em que cada
# requisição terminava no log do host. `docker logs erpnovo-web` passa a dizer
# quanto cada uma levou.
log_format erpnovo_tempo '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                         'rt=$request_time urt=$upstream_response_time';

server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.php;

    client_max_body_size 64M;

    access_log /dev/stdout erpnovo_tempo;
    error_log  /dev/stderr;

    include /etc/nginx/erpnovo-security-headers.conf;

    # Compressão aqui, e não no Nginx do host: o do host é compartilhado com as
    # outras aplicações da VPS e só comprime text/html (gzip_types comentado).
    # Medido em 12/10/2026: o primeiro carregamento da SPA baixava 650 KB que
    # viram 196 KB comprimidos, e a lista de comodatos ia em 610 KB de JSON
    # cru. O host repassa Accept-Encoding e não recomprime o que já vem
    # comprimido. Nível 5: quase o tamanho do 9 com uma fração da CPU.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/javascript text/css text/plain image/svg+xml application/xml;

    # ── Landing — RAIZ EXATA do domínio (= / casa só a raiz). ──
    location = / {
        root /var/www/public/landing;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/erpnovo-security-headers.conf;
    }

    # Assets da landing: a página é exposta em `/`, mas os arquivos vivem em
    # `public/landing/img`. Declarar a rota evita que uma URL relativa seja
    # resolvida como `/img/...` e caia no root geral de `public/`.
    location ^~ /landing/img/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/erpnovo-security-headers.conf;
    }

    # ── SPA React — assets imutáveis (hash no nome) → cache longo. ──
    # root + caminho /novo/app/... mapeia direto para /var/www/public/novo/app/...?
    # NÃO: o build fica em public/app. Usamos rewrite p/ servir public/app sob /novo/app.
    location ^~ /novo/app/assets/ {
        rewrite ^/novo/app/(.*)$ /app/$1 break;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/erpnovo-security-headers.conf;
    }

    # SPA: index nunca cacheado; fallback p/ rotas client-side (/novo/app/clientes).
    location ^~ /novo/app {
        rewrite ^/novo/app/?$ /app/index.html break;
        rewrite ^/novo/app/(.*)$ /app/$1 break;
        try_files $uri /app/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/erpnovo-security-headers.conf;
    }

    # ── API/Sanctum/rotas sob /novo → Laravel (front controller). ──
    # O prefixo /novo é removido e a URI sem prefixo é passada ao PHP via
    # REQUEST_URI explícito. `rewrite ... last`/`try_files` NÃO bastam: o nginx
    # mantém $request_uri ORIGINAL (=/novo/up), e o fastcgi_params padrão envia
    # REQUEST_URI $request_uri → o Laravel via /novo/up (404). Aqui forçamos a URI
    # já sem o prefixo no fastcgi, mantendo a query string.
    location ^~ /novo/ {
        # Captura o caminho sem o prefixo (/novo/up → /up).
        rewrite ^/novo(/.*)$ $1 break;

        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $uri$is_args$args;   # $uri já está sem /novo (rewrite acima)
        fastcgi_param DOCUMENT_URI $uri;
        fastcgi_param PATH_INFO $uri;
        fastcgi_read_timeout 300;
    }
    # /novo (sem barra) → SPA.
    location = /novo { return 302 /novo/app/; }

    # ── Compatibilidade: caso o Nginx do HOST faça strip do /novo (o container
    #    recebe /app e /api direto), a SPA e a API continuam funcionando. ──
    location /app/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/erpnovo-security-headers.conf;
    }
    location /app {
        try_files $uri /app/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/erpnovo-security-headers.conf;
    }

    # Demais caminhos na raiz (favicon, logo_icon.svg, robots, /up) e API sem
    # prefixo → arquivos de public/ ou front controller (index.php).
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
