# Nginx do CONTAINER do erp-novo (web → app:9000 php-fpm).
# Serve a API (Laravel 12 + Sanctum) e a SPA React (build em public/app).
# O host faz strip do prefixo /novo, então aqui as rotas chegam como /app, /api, etc.
server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.php;

    client_max_body_size 64M;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    # SPA React — build estático em public/app. Fallback p/ index.html (rotas
    # client-side: /app/clientes, etc.). Sem $uri/ (evita 403 de listagem).
    location /app {
        try_files $uri /app/index.html;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
