# ──────────────────────────────────────────────────────────────────────────
# erp-novo (backend reescrito) — HOMOLOGAÇÃO na VPS.
#
# COEXISTE com o ctrl-web (legado) SEM colidir:
#   - rede própria (erpnovo), containers próprios (erpnovo-*), volumes próprios;
#   - BANCO PRÓPRIO (Postgres isolado) — NÃO toca o banco de produção do legado;
#   - porta interna 127.0.0.1:3120 (legado usa 3110/3111/3112; faixa 3100-3299).
#
# O Nginx do HOST faz TLS e proxy por domínio (ex.: homolog-erp.gasemcasa.com.br
# → 127.0.0.1:3120). Segredos vêm de .env (NÃO versionado).
# ──────────────────────────────────────────────────────────────────────────
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: erpnovo-app:homolog
    container_name: erpnovo-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - app_storage:/var/www/storage
      - app_vendor:/var/www/vendor
      - app_bootstrap_cache:/var/www/bootstrap/cache
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - erpnovo

  web:
    image: nginx:1.25-alpine
    container_name: erpnovo-web
    restart: unless-stopped
    # Só local: o Nginx do HOST faz o TLS e o proxy público.
    ports:
      - "127.0.0.1:3120:80"
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - erpnovo

  # Worker de FILA (PF-5 da auditoria) — processa os jobs assíncronos: auto-
  # atribuição de pedido (AtribuirPedidoJob), push (EnviarPushJob), geocodificação
  # (GeocodificarClienteJob), alertas. Sem este container os jobs ficam parados na
  # fila e as features nunca disparam. Reusa a MESMA imagem da app; só troca o
  # comando. --max-time recicla o processo (evita memory leak em runs longos).
  queue:
    image: erpnovo-app:homolog
    container_name: erpnovo-queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --sleep=1 --tries=3 --max-time=3600
    volumes:
      - .:/var/www
      - app_storage:/var/www/storage
      - app_vendor:/var/www/vendor
      - app_bootstrap_cache:/var/www/bootstrap/cache
    env_file:
      - .env
    depends_on:
      - app
      - db
      - redis
    networks:
      - erpnovo

  # SCHEDULER (PF-6) — dispara os 8 comandos agendados (expirar PIX, gerar missões,
  # notificar vencidos, sync GPS…). `schedule:work` é um loop que executa o
  # schedule:run a cada minuto no próprio processo (sem precisar de crontab no host).
  scheduler:
    image: erpnovo-app:homolog
    container_name: erpnovo-scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan schedule:work
    volumes:
      - .:/var/www
      - app_storage:/var/www/storage
      - app_vendor:/var/www/vendor
      - app_bootstrap_cache:/var/www/bootstrap/cache
    env_file:
      - .env
    depends_on:
      - app
      - db
      - redis
    networks:
      - erpnovo

  # REVERB (PF-8) — servidor WebSocket nativo do Laravel (tempo real: posição do
  # entregador, status do pedido, PIX confirmado). Sem ele BROADCAST_CONNECTION cai
  # para `log` e os apps ficam só no polling. Exposto ao Nginx do host, que faz o
  # proxy/TLS de wss:// para 127.0.0.1:3121. Requer BROADCAST_CONNECTION=reverb +
  # REVERB_* no .env.
  reverb:
    image: erpnovo-app:homolog
    container_name: erpnovo-reverb
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "127.0.0.1:3121:8080"
    volumes:
      - .:/var/www
      - app_storage:/var/www/storage
      - app_vendor:/var/www/vendor
      - app_bootstrap_cache:/var/www/bootstrap/cache
    env_file:
      - .env
    depends_on:
      - app
      - redis
    networks:
      - erpnovo

  db:
    image: postgres:15-alpine
    container_name: erpnovo-db
    restart: unless-stopped
    environment:
      # O Postgres é INICIALIZADO com a role OWNER (dona do schema, cria tabelas).
      # O RUNTIME da app NÃO usa esta role — conecta com a role restrita erp_app
      # (NOSUPERUSER/NOBYPASSRLS), senão o Row-Level Security é ignorado e os dados
      # vazariam entre empresas. Fallback p/ DB_USERNAME mantém bancos já existentes.
      POSTGRES_DB: ${DB_DATABASE:-erp_novo}
      POSTGRES_USER: ${DB_OWNER_USERNAME:-${DB_USERNAME:-erp}}
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?defina DB_OWNER_PASSWORD no .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - erpnovo

  redis:
    image: redis:7-alpine
    container_name: erpnovo-redis
    restart: unless-stopped
    networks:
      - erpnovo

volumes:
  db_data:
  app_vendor:
  app_storage:
  app_bootstrap_cache:

networks:
  erpnovo:
    driver: bridge
