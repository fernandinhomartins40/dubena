# ──────────────────────────────────────────────────────────────────────────
# Ambiente de DEV/STAGING do api-app-gc (API do app "Gás em Casa").
# Laravel 5.6 · 2 bancos MySQL (sgcm_api + sgcm_logs) · Redis.
# Portas distintas do piloto monitoramento (8081/3308) para coexistirem.
# NÃO usar dados reais de produção. Ver README.docker.md antes de expor na VPS.
# ──────────────────────────────────────────────────────────────────────────
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: sgcm-api-app:php7.1
    container_name: sgcm-api-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    env_file:
      - .env.docker
    depends_on:
      - db
      - redis
    networks:
      - sgcm

  web:
    image: nginx:1.25-alpine
    container_name: sgcm-api-web
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - sgcm

  db:
    image: mysql:5.7
    container_name: sgcm-api-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sgcm_api
      MYSQL_USER: sgcm
      MYSQL_PASSWORD: sgcm_dev_pwd          # senha FAKE de dev
      MYSQL_ROOT_PASSWORD: root_dev_pwd      # senha FAKE de dev
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - sgcm

  redis:
    image: redis:7-alpine
    container_name: sgcm-api-redis
    restart: unless-stopped
    networks:
      - sgcm

volumes:
  db_data:

networks:
  sgcm:
    driver: bridge
