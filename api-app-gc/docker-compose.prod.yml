# ──────────────────────────────────────────────────────────────────────────
# api-app-gc (API do app) — PRODUÇÃO na VPS.
# Container nginx em 127.0.0.1:3111; Nginx do HOST faz TLS/proxy por domínio.
# Banco MySQL (2 schemas: sgcm_api + sgcm_logs). Segredos via .env.
# ──────────────────────────────────────────────────────────────────────────
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: sgcm-api-app:prod
    container_name: sgcm-api-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./storage:/var/www/storage
      - app_vendor:/var/www/vendor
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - sgcm

  web:
    image: nginx:1.25-alpine
    container_name: sgcm-api-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3111:80"
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - sgcm

  db:
    image: mysql:5.7
    container_name: sgcm-api-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sgcm_api}
      MYSQL_USER: ${DB_USERNAME:-sgcm}
      MYSQL_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?defina DB_ROOT_PASSWORD no .env}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - sgcm

  redis:
    image: redis:7-alpine
    container_name: sgcm-api-redis
    restart: unless-stopped
    networks:
      - sgcm

volumes:
  db_data:
  app_vendor:

networks:
  sgcm:
    driver: bridge
