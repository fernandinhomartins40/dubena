; Ajustes de PHP para o monitoramento-veiculos (dev/staging)
memory_limit = 512M
upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 120
date.timezone = America/Sao_Paulo

; OPcache (perf). Em dev pode deixar revalidate alto para refletir edições.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Logs de erro vão para o stderr do container (visível no docker logs).
log_errors = On
error_log = /dev/stderr
display_errors = Off
