# ──────────────────────────────────────────────────────────────────────────
# Ambiente de DEV/STAGING do piloto monitoramento-veiculos.
# Backend em containers; banco MySQL local de teste (dados fake).
# NÃO usar dados reais de produção. Antes de expor na VPS, ver README.docker.md.
# ──────────────────────────────────────────────────────────────────────────
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: monitora-app:php7.1
    container_name: monitora-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    env_file:
      - .env.docker
    depends_on:
      - db
      - redis
    networks:
      - monitora

  web:
    image: nginx:1.25-alpine
    container_name: monitora-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - monitora

  db:
    # Alinhamento de stack: monitoramento agora em PostgreSQL (como o ERP).
    image: postgres:15-alpine
    container_name: monitora-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: monitora
      POSTGRES_USER: monitora
      POSTGRES_PASSWORD: monitora_dev_pwd     # senha FAKE de dev
    ports:
      - "5434:5432"                            # host:container (evita conflito)
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - monitora

  redis:
    image: redis:7-alpine
    container_name: monitora-redis
    restart: unless-stopped
    networks:
      - monitora

volumes:
  db_data:

networks:
  monitora:
    driver: bridge
