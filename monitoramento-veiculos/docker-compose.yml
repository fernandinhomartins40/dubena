# ──────────────────────────────────────────────────────────────────────────
# Ambiente de DEV/STAGING do piloto monitoramento-veiculos.
# Backend em containers; banco MySQL local de teste (dados fake).
# NÃO usar dados reais de produção. Antes de expor na VPS, ver README.docker.md.
# ──────────────────────────────────────────────────────────────────────────
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: monitora-app:php7.1
    container_name: monitora-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    env_file:
      - .env.docker
    depends_on:
      - db
      - redis
    networks:
      - monitora

  web:
    image: nginx:1.25-alpine
    container_name: monitora-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - monitora

  db:
    image: mysql:5.7
    container_name: monitora-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: monitora
      MYSQL_USER: monitora
      MYSQL_PASSWORD: monitora_dev_pwd      # senha FAKE de dev — trocar e usar segredo na VPS
      MYSQL_ROOT_PASSWORD: root_dev_pwd      # senha FAKE de dev
    command: --character-set-server=utf8 --collation-server=utf8_unicode_ci
    ports:
      - "3307:3306"                          # host:container (3307 evita conflito com MySQL local)
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - monitora

  redis:
    image: redis:7-alpine
    container_name: monitora-redis
    restart: unless-stopped
    networks:
      - monitora

volumes:
  db_data:

networks:
  monitora:
    driver: bridge
