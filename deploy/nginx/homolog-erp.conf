# Nginx do HOST para o erp-novo em HOMOLOGAÇÃO — mesmo padrão da VPS.
# Coloque em /etc/nginx/sites-available/ e crie symlink em sites-enabled/.
# Depois rode: certbot --nginx -d homolog-erp.SEU_DOMINIO  (gera o TLS).
#
# Container do erp-novo escuta em 127.0.0.1:3120 (legado: 3110/3111/3112).
# Ajuste o server_name para o subdomínio real de homologação.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    server_name homolog-erp.gasemcasa.com.br;   # <- ajustar
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:3120;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300;
    }

    listen 80;
    # O bloco 443 ssl é adicionado automaticamente pelo `certbot --nginx`.
}
