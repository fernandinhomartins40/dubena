# Nginx do HOST para o erp-novo em HOMOLOGAÇÃO — mesmo padrão da VPS.
# Coloque em /etc/nginx/sites-available/ e crie symlink em sites-enabled/.
# Depois rode: certbot --nginx -d homolog-erp.SEU_DOMINIO  (gera o TLS).
#
# Container do erp-novo escuta em 127.0.0.1:3120 (legado: 3110/3111/3112).
# Ajuste o server_name para o subdomínio real de homologação.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    server_name homolog-erp.gasemcasa.com.br;
    client_max_body_size 64m;
    listen 443 ssl;
    http2 on;
    ssl_certificate /etc/letsencrypt/live/homolog-erp.gasemcasa.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/homolog-erp.gasemcasa.com.br/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3120;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300;
    }

}

server {
    listen 80;
    server_name homolog-erp.gasemcasa.com.br;
    return 301 https://$host$request_uri;
}
