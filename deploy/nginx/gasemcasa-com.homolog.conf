# Nginx do HOST para gasemcasa.com — HOMOLOGAÇÃO do erp-novo (2026-10-09).
#
# A VPS foi reinstalada e o legado (ctrl-web, 3110) não roda mais nela: tudo
# vai para o contêiner web do erp-novo (127.0.0.1:3120), que serve a landing
# na raiz, a SPA em /novo/app e a API em /novo/api. Só o WebSocket do Reverb
# (3121) tem rota própria.
#
# O `map $http_upgrade $connection_upgrade` NÃO é declarado aqui: o host já o
# define em /etc/nginx/conf.d/upgrade-map.conf, e declarar de novo reprova o
# `nginx -t` de TODAS as aplicações da VPS.
#
# Instalação: /etc/nginx/sites-available/gasemcasa-com + symlink em
# sites-enabled + `certbot --nginx -d gasemcasa.com -d www.gasemcasa.com`
# (o certbot acrescenta o bloco 443 e o redirecionamento).

server {
    listen 80;
    server_name gasemcasa.com www.gasemcasa.com;
    client_max_body_size 64m;

    location /reverb/ {
        proxy_pass http://127.0.0.1:3121/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Conexão longa e silenciosa entre eventos: o default de 60 s a
        # derrubaria a cada minuto de inatividade.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    location / {
        proxy_pass http://127.0.0.1:3120;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection "";
        proxy_hide_header X-Powered-By;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
