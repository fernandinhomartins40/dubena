# ESTADO "NOVO" (T6.3) — pós-cutover: tudo no erp-novo.
#
# Alvo de `deploy/nginx/virar.sh novo`. A diferença para o estado `legado` é
# uma só, e é toda a virada: o `location /` deixa de apontar para o ctrl-web
# (:3110) e passa a apontar para o container novo (:3120).
#
# O ctrl-web CONTINUA DE PÉ em :3110, alcançável por /legado/ — o plano (T6.6.4)
# manda mantê-lo por ≥ 30 dias como rede de consulta para o que a triagem T4.9
# classificou como PÓS-GO-LIVE, e como fonte de qualquer reconciliação. Desligar
# o container junto com a virada eliminaria o rollback Nível 1.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    server_name gasemcasa.com www.gasemcasa.com;
    client_max_body_size 64m;

    # ── Tempo real: WebSocket do Reverb ─────────────────────────────────────
    #
    # Antes do `location /` genérico: o nginx casa prefixo mais específico
    # primeiro, mas deixar explícito evita que uma edição futura inverta a
    # ordem e mande o handshake para o PHP.
    location /reverb/ {
        proxy_pass http://127.0.0.1:3121/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket é conexão longa e silenciosa entre eventos: o timeout padrão
        # de 60s a derrubaria a cada minuto de inatividade.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # ── Legado em modo consulta (T6.6.4) ────────────────────────────────────
    #
    # Sobrevive à virada por ≥ 30 dias, agora sob prefixo próprio. A ESCRITA é
    # bloqueada no lado do ctrl-web (modo manutenção + revogação do privilégio
    # de escrita da role no Oracle/MySQL, passo 8 do runbook) — não aqui: um
    # bloqueio só de nginx seria contornável por qualquer rota não prevista.
    location /legado/ {
        proxy_pass http://127.0.0.1:3110/;
        include /etc/nginx/proxy_params;
    }

    # ── TUDO para o erp-novo ────────────────────────────────────────────────
    #
    # É esta linha que constitui a virada. No estado `legado` ela aponta para
    # 3110; aqui, para 3120. O container novo serve a landing na raiz, a SPA em
    # /novo/app e a API em /novo/api.
    location / {
        proxy_pass http://127.0.0.1:3120;
        include /etc/nginx/proxy_params;
    }

    listen 80;
    # O bloco 443 ssl é adicionado automaticamente pelo `certbot --nginx`.
    # ⚠️ Ao trocar o vhost, o certbot precisa ter rodado sobre AMBOS os arquivos,
    # ou a virada derruba o TLS. O virar.sh checa isso antes de recarregar.
}
