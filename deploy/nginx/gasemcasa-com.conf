# Nginx do HOST para gasemcasa.com (domínio único durante a transição).
# Coloque em /etc/nginx/sites-available/ + symlink em sites-enabled/ + certbot --nginx.
#
# ARQUITETURA (monorepo erp-novo autossuficiente): o HOST só faz TLS + proxy,
# SEM strip de prefixo. O nginx DENTRO do container do erp-novo (127.0.0.1:3120)
# serve a LANDING na raiz, a SPA em /novo/app e a API em /novo/api.
#
#   gasemcasa.com/            → container 3120 → landing (escolha novo × legado)
#   gasemcasa.com/novo/...    → container 3120 → SPA + API do erp-novo
#   gasemcasa.com/login,/home → container 3110 → ctrl-web (legado, intacto)
#
# Assim a landing deixa de ser um arquivo solto em /var/www/html (sem deploy):
# ela entra no MESMO deploy do erp-novo (erp-novo/public/landing).

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    server_name gasemcasa.com www.gasemcasa.com;
    client_max_body_size 64m;

    # Raiz + tudo do erp-novo (landing na raiz, SPA e API sob /novo) → container novo.
    # `= /` e `/novo/` vão para o 3120; o container decide o que servir.
    location = / {
        proxy_pass http://127.0.0.1:3120;
        include /etc/nginx/proxy_params;
    }

    location /novo/ {
        proxy_pass http://127.0.0.1:3120;
        include /etc/nginx/proxy_params;
    }

    # Assets estáticos da raiz que o container serve (favicon, logo_icon.svg, robots).
    location = /logo_icon.svg { proxy_pass http://127.0.0.1:3120; include /etc/nginx/proxy_params; }
    location = /favicon.ico   { proxy_pass http://127.0.0.1:3120; include /etc/nginx/proxy_params; }
    location = /robots.txt    { proxy_pass http://127.0.0.1:3120; include /etc/nginx/proxy_params; }

    # Todo o resto (/, /login, /home, /pedido, ...) → legado (ctrl-web).
    location / {
        proxy_pass http://127.0.0.1:3110;
        include /etc/nginx/proxy_params;
    }

    listen 80;
    # O bloco 443 ssl é adicionado automaticamente pelo `certbot --nginx`.
}

# /etc/nginx/proxy_params (criar uma vez, se não existir):
#   proxy_http_version 1.1;
#   proxy_set_header Upgrade $http_upgrade;
#   proxy_set_header Connection $connection_upgrade;
#   proxy_set_header Host $host;
#   proxy_set_header X-Real-IP $remote_addr;
#   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#   proxy_set_header X-Forwarded-Proto $scheme;
#   proxy_set_header X-Forwarded-Host $host;
