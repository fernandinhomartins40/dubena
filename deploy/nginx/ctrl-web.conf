# Nginx do HOST para o ctrl-web (ERP) — seguir o padrão da VPS.
# Coloque em /etc/nginx/sites-available/ e crie symlink em sites-enabled/.
# Depois rode certbot --nginx -d erp.SEU_DOMINIO para gerar o TLS.
#
# Ajuste o server_name para o domínio real do ERP.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    server_name erp.gasemcasa.com.br;     # <- ajustar
    client_max_body_size 64m;              # ERP gera PDFs/relatórios grandes

    location / {
        proxy_pass http://127.0.0.1:3110;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300;            # NF-e/SEFAZ podem demorar
    }

    listen 80;
    # O bloco 443 ssl é adicionado automaticamente pelo `certbot --nginx`.
}
