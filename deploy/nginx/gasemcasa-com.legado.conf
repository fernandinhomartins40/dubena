# ESTADO "LEGADO" (T6.3) — coexistência strangler, o estado ATUAL de produção.
#
# Este arquivo é o alvo de `deploy/nginx/virar.sh legado`, que é também o
# ROLLBACK NÍVEL 1 do cutover: a reversão mais barata disponível (segundos).
# Ele é cópia fiel de gasemcasa-com.conf — mantenha os dois em sincronia, ou
# reverter passará a significar "voltar para um estado que nunca existiu".
#
# Nginx do HOST para gasemcasa.com (domínio único durante a transição).
# Coloque em /etc/nginx/sites-available/ + symlink em sites-enabled/ + certbot --nginx.
#
# ARQUITETURA (monorepo erp-novo autossuficiente): o HOST só faz TLS + proxy,
# SEM strip de prefixo. O nginx DENTRO do container de produção (127.0.0.1:3130)
# serve a LANDING na raiz, a SPA em /novo/app e a API em /novo/api.
#
#   gasemcasa.com/            → produção 3130 → landing (escolha novo × legado)
#   gasemcasa.com/novo/...    → produção 3130 → SPA + API do erp-novo
#   gasemcasa.com/login,/home → container 3110 → ctrl-web (legado, intacto)
#
# Assim a landing deixa de ser um arquivo solto em /var/www/html (sem deploy):
# ela entra no MESMO deploy do erp-novo (erp-novo/public/landing).

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    server_name gasemcasa.com www.gasemcasa.com;
    client_max_body_size 64m;
    listen 443 ssl;
    http2 on;
    ssl_certificate /etc/letsencrypt/live/gasemcasa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gasemcasa.com/privkey.pem;

    # Raiz + tudo do erp-novo (landing na raiz, SPA e API sob /novo) → container novo.
    # `= /` e `/novo/` vão para o 3130; o container decide o que servir.
    location = / {
        proxy_pass http://127.0.0.1:3130;
        include /etc/nginx/erpnovo-proxy-params.conf;
    }

    location /novo/ {
        proxy_pass http://127.0.0.1:3130;
        include /etc/nginx/erpnovo-proxy-params.conf;
    }

    # Assets estáticos da raiz que o container serve (favicon, logo_icon.svg, robots).
    location = /logo_icon.svg { proxy_pass http://127.0.0.1:3130; include /etc/nginx/erpnovo-proxy-params.conf; }
    location = /favicon.ico   { proxy_pass http://127.0.0.1:3130; include /etc/nginx/erpnovo-proxy-params.conf; }
    location = /robots.txt    { proxy_pass http://127.0.0.1:3130; include /etc/nginx/erpnovo-proxy-params.conf; }

    # ── Tempo real: WebSocket do Reverb (T3.9) ──────────────────────────────
    #
    # O container `reverb` expõe 127.0.0.1:3131.
    # para ele: os 5 eventos ShouldBroadcast (PixConfirmado, PedidoAtribuido,
    # PedidoEntrouNaFila, EntregadorPosicaoAtualizada, PedidoStatusAtualizado)
    # não chegavam a lugar nenhum, e os apps caíam para polling.
    #
    # O caminho `/reverb/` casa com o que os apps montam a partir de
    # REVERB_HOST/PORT/SCHEME (laravel-echo + pusher-js).
    location /reverb/ {
        proxy_pass http://127.0.0.1:3131/;

        # Sem estes três o handshake de upgrade não acontece e a conexão cai
        # como HTTP comum — o cliente reconecta em laço.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket é conexão longa e silenciosa entre eventos: o timeout padrão
        # de 60s a derrubaria a cada minuto de inatividade.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # Todo o resto (/, /login, /home, /pedido, ...) → legado (ctrl-web).
    location / {
        proxy_pass http://127.0.0.1:3110;
        include /etc/nginx/erpnovo-proxy-params.conf;
    }

}

server {
    listen 80;
    server_name gasemcasa.com www.gasemcasa.com;
    return 301 https://$host$request_uri;
}
